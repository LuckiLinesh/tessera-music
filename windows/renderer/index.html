<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tessera Music</title>
  <meta name="theme-color" content="#121212" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 2h8v8H3zM13 2h8v8h-8zM3 12h8v8H3zM13 12h8v8h-8z' fill='%231ed760'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="brand">Tessera</div>
      <div id="status">Desktop - downloads available</div>
    </header>
    <main id="main">
      <h1 id="title">Tessera Music</h1>
      <p id="sub">A universal, legally accessible global music search and player.</p>
      <div id="actions">
        <button id="pick" class="btn">Choose download folder</button>
      </div>
      <div id="folder" style="display:none"></div>
      <div id="progress"></div>
      <p id="hint">Downloads stream from the catalog you play. Pick a track and press its download button in the web player.</p>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
