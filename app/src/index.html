<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tessera — Web Player</title>
<meta name="description" content="A login-free music player. Real streaming, no account, no paid tier." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>

    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16.6 4H19v16h-2.4zM5 4.5v15L15.5 12z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3.5 20.5 7 16 10.5V8.8h-1.6c-1.1 0-1.7.5-2.5 1.6l-1.5 2.1-1.2-1.7 1.2-1.7C11.5 7.4 12.6 6.8 14.4 6.8H16zM3 8.8h2.6c1.8 0 2.9.6 4 2.3l4.4 6.1c1.1 1.6 2.2 2.3 4 2.3h1V21h-1c-2.6 0-4.2-1.1-5.5-3l-4.4-6.1c-.8-1.2-1.4-1.1-2.5-1.1H3zm0 9.2v-1.8h2.6c1.1 0 1.7.1 2.5-1.1l1-1.4 1.2 1.7-.9 1.2c-1.1 1.6-2.2 2.3-3.8 2.3zm9.4-11.5 1.2 1.7-.7 1c-.5.7-.9 1-1.8 1H10v-1.8h1.9c.3 0 .4 0 .7-.4z" fill="currentColor"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 4h10a4 4 0 0 1 4 4v4h-2V8a2 2 0 0 0-2-2H7v3L2.5 5.5 7 2zm10 16H7a4 4 0 0 1-4-4v-4h2v4a2 2 0 0 0 2 2h10v-3l4.5 3.5-4.5 3.5z" fill="currentColor"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 4h10a4 4 0 0 1 4 4v4h-2V8a2 2 0 0 0-2-2H7v3L2.5 5.5 7 2zm10 16H7a4 4 0 0 1-4-4v-4h2v4a2 2 0 0 0 2 2h10v-3l4.5 3.5-4.5 3.5zM12.8 8.6v6.8h-1.6v-5l-1.2.4-.3-1.3z" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5 4.2 12.9a4.6 4.6 0 0 1 0-6.5 4.5 4.5 0 0 1 6.4 0l1.4 1.4 1.4-1.4a4.5 4.5 0 0 1 6.4 0 4.6 4.6 0 0 1 0 6.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.5 4.2 12.9a4.6 4.6 0 0 1 0-6.5 4.5 4.5 0 0 1 6.4 0l1.4 1.4 1.4-1.4a4.5 4.5 0 0 1 6.4 0 4.6 4.6 0 0 1 0 6.5z" fill="currentColor"/></symbol>

    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="18.5" r="1.9" fill="currentColor"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 5h13v2H3zm0 4h13v2H3zm0 4h9v2H3zm0 4h9v2H3zm14-9.5v9.2a3 3 0 1 0 2 2.8V7.5l3-1V4z" fill="currentColor"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.4v13.2L7.5 14.5H4zM15.4 8.2a5.4 5.4 0 0 1 0 7.6l-1.3-1.3a3.6 3.6 0 0 0 0-5zm2.6-2.6a9 9 0 0 1 0 12.8l-1.3-1.3a7.2 7.2 0 0 0 0-10.2z" fill="currentColor"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.4v13.2L7.5 14.5H4zM15.3 9.4l1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.1-3.1 1.4 1.4L12 16l-5.5-5.5 1.4-1.4L11 12.2zM4 18h16v2.5H4z" fill="currentColor"/></symbol>

    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 4 7 12l7.5 8 1.5-1.4L9.9 12 16 5.4z" fill="currentColor"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 4 17 12l-7.5 8L8 18.6 14.1 12 8 5.4z" fill="currentColor"/></symbol>

    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5.3 4 6.7 6.7L18.7 4 20 5.3 13.3 12 20 18.7 18.7 20 12 13.3 5.3 20 4 18.7 10.7 12 4 5.3z" fill="currentColor"/></symbol>

<div class="app" id="app">
  <header class="topbar">
    <a class="logo" href="/" data-link aria-label="Tessera home">
      <svg class="logo__mark" aria-hidden="true"><use href="#i-logo"/></svg>
      <span class="logo__word">Tessera</span>
    </a>

    <button class="round-btn" id="homeBtn" data-link-href="/" title="Home" aria-label="Home">
      <svg aria-hidden="true"><use href="#i-home"/></svg>
    </button>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <button class="search__icon" type="submit" aria-label="Search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
      </button>
      <input id="searchInput" class="search__input" type="search" placeholder="What do you want to play?" aria-label="What do you want to play?" />
      <button class="search__browse" type="button" id="searchClear" aria-label="Clear search field">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </form>

    <div class="topbar__right">
      <a class="topbar__link" href="/download" data-link>Download</a>
      <a class="round-btn" href="/settings" data-link title="Settings" aria-label="Settings" id="gearLink"
         style="width:34px;height:34px">
        <svg aria-hidden="true" style="width:18px;height:18px"><use href="#i-gear"/></svg>
      </a>
      <span class="badge" title="No account, no paid tier">Free</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <button class="sidebar__title" data-link-href="/liked">
          <svg aria-hidden="true"><use href="#i-library"/></svg>
          <span>Your Library</span>
        </button>
        <button class="chip" id="createBtn" title="Create playlist">
          <svg aria-hidden="true"><use href="#i-plus"/></svg>
          <span>Create</span>
        </button>
      </div>
      <div class="sidebar__body" id="libraryList"></div>
      <div class="sidebar__foot">
        <a href="/download" data-link>Cookies</a>
        <button class="lang" type="button" id="langBtn">
          <svg aria-hidden="true"><use href="#i-globe"/></svg>
          English
        </button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="queue" id="queue" hidden>
    <div class="queue__head">
      <h2>Queue</h2>
      <button class="icon-btn" id="queueClose" aria-label="Close queue"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="queue__body" id="queueBody"></div>
  </div>

  <footer class="player" id="player">
    <div class="player__now">
      <div class="player__art" id="npArt"></div>
      <div class="player__meta">
        <a class="player__title" id="npTitle" href="/">Nothing playing</a>
        <a class="player__artist" id="npArtist" href="/"></a>
        <span class="player__tag" id="npPreview" hidden>30s preview</span>
      </div>
      <button class="icon-btn" id="npLike" aria-label="Save to your library" aria-pressed="false">
        <svg aria-hidden="true"><use href="#i-heart"/></svg>
      </button>
    </div>

    <div class="player__center">
      <div class="player__controls">
        <button class="icon-btn" id="shuffleBtn" aria-label="Enable shuffle" aria-pressed="false">
          <svg aria-hidden="true"><use href="#i-shuffle"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" aria-label="Previous"><svg aria-hidden="true"><use href="#i-prev"/></svg></button>
        <button class="play-btn" id="playBtn" aria-label="Play">
          <svg aria-hidden="true"><use href="#i-play"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="Next"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="repeatBtn" aria-label="Enable repeat" aria-pressed="false">
          <svg aria-hidden="true"><use href="#i-repeat"/></svg>
        </button>
      </div>
      <div class="player__progress">
        <span class="time" id="curTime">0:00</span>
        <input class="range" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Change progress" />
        <span class="time" id="durTime">0:00</span>
      </div>
    </div>

    <div class="player__right">
      <button class="icon-btn" id="queueBtn" aria-label="Queue" aria-pressed="false">
        <svg aria-hidden="true"><use href="#i-queue"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" aria-label="Change volume">
        <svg aria-hidden="true"><use href="#i-volume"/></svg>
      </button>
      <input class="range range--vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Change volume" />
    </div>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="menu" id="menu" hidden></div>

<audio id="audio" preload="metadata"></audio>

<script src="/app.js" type="module"></script>
</body>
</html>
